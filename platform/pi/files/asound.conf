# the USB audio device by name: the card numbers change between boots (the HDMI ports come first, with nothing on them), and
# the game opens "default". Remove this file to use an HDMI sink instead.
pcm.!default {
  type plug
  slave.pcm "hw:CARD=Audio,DEV=0"
}
ctl.!default {
  type hw
  card Audio
}
